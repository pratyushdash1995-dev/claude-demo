name: Godot Android APK

on:
  push:
    branches: [main]
    paths:
      - "godot-tictactoe/**"
      - ".github/workflows/godot-android.yml"
    tags: ["tictactoe-v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Install Godot and export templates
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          unzip -q templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          godot --version

      - name: Configure Godot for Android export
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$HOME/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p "$HOME/.config/godot"
          cat > /tmp/editor_settings.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          SETTINGS
          # the file name differs between Godot minor versions, so write both
          cp /tmp/editor_settings.tres "$HOME/.config/godot/editor_settings-4.tres"
          cp /tmp/editor_settings.tres "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres"

      - name: Import project
        working-directory: godot-tictactoe
        run: godot --headless --import || true

      - name: Export APK
        working-directory: godot-tictactoe
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/neon-tictactoe.apk 2>&1 | tee export.log
          test -f build/neon-tictactoe.apk
          ls -la build

      - name: Show Godot log on failure
        if: failure()
        working-directory: godot-tictactoe
        run: |
          MSG=$(tail -n 40 export.log 2>/dev/null | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Godot export log::$MSG"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neon-tictactoe-apk
          path: godot-tictactoe/build/neon-tictactoe.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/tictactoe-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" godot-tictactoe/build/neon-tictactoe.apk \
            --title "Neon Tic Tac Toe ${{ github.ref_name }}" \
            --generate-notes
