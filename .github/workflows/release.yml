name: Release APK

on:
  push:
    tags: ["v*"]            # e.g. v1.0, v1.1
  workflow_dispatch:

permissions:
  contents: write           # needed to create a GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "claude-demo-${{ github.ref_name }}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "claude-demo-${{ github.ref_name }}.apk" \
            --title "Claude Demo ${{ github.ref_name }}" \
            --generate-notes
